name: Recognition Phase 1 checks

on:
  push:
    branches:
      - phase1/dataset-label-validation
  workflow_dispatch:

jobs:
  syntax-and-label-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recognition-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: python -m pip install --upgrade pip torch tqdm
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run label regression tests
        run: python -m unittest discover -s tests -v
